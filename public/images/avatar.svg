<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6df0"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="46" fill="#0b0b13"/>
  <rect width="200" height="200" rx="46" fill="url(#bg)" opacity="0.85"/>

  <!-- decorative glow & blobs -->
  <circle cx="150" cy="40" r="46" fill="url(#glow)"/>
  <circle cx="36" cy="164" r="52" fill="#f0abfc" opacity="0.28"/>
  <circle cx="172" cy="150" r="34" fill="#93c5fd" opacity="0.3"/>

  <!-- glass sheen -->
  <rect x="14" y="14" width="172" height="82" rx="36" fill="url(#glass)"/>

  <!-- initials -->
  <text x="100" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff" opacity="0.95">EY</text>

  <!-- glass border -->
  <rect x="1" y="1" width="198" height="198" rx="45" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
</svg>
