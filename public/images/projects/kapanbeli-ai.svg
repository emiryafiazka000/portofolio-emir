<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2847"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  <circle cx="200" cy="150" r="200" fill="#2f81f7" opacity="0.08" filter="url(#blur1)"/>
  <circle cx="600" cy="350" r="180" fill="#34d399" opacity="0.06" filter="url(#blur1)"/>
  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="500"/><line x1="50" y1="0" x2="50" y2="500"/><line x1="100" y1="0" x2="100" y2="500"/><line x1="150" y1="0" x2="150" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/><line x1="250" y1="0" x2="250" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/><line x1="350" y1="0" x2="350" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/><line x1="550" y1="0" x2="550" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/><line x1="650" y1="0" x2="650" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="450" x2="800" y2="450"/><line x1="0" y1="500" x2="800" y2="500"/>
  </g>
  <!-- Pantry shelves -->
  <rect x="100" y="100" width="250" height="300" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="100" y1="180" x2="350" y2="180" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="100" y1="260" x2="350" y2="260" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="100" y1="340" x2="350" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Food items on shelves -->
  <rect x="120" y="115" width="40" height="55" rx="6" fill="#2f81f7" opacity="0.3" stroke="#2f81f7" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="175" y="125" width="35" height="45" rx="6" fill="#34d399" opacity="0.3" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="225" y="110" width="45" height="60" rx="6" fill="#ffd166" opacity="0.3" stroke="#ffd166" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="285" y="120" width="35" height="50" rx="6" fill="#ff6b6b" opacity="0.3" stroke="#ff6b6b" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="120" y="195" width="50" height="50" rx="6" fill="#a78bfa" opacity="0.3" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="185" y="200" width="40" height="45" rx="6" fill="#2f81f7" opacity="0.25" stroke="#2f81f7" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="240" y="190" width="45" height="55" rx="6" fill="#34d399" opacity="0.25" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="300" y="205" width="30" height="40" rx="6" fill="#ffd166" opacity="0.25" stroke="#ffd166" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Status indicators -->
  <circle cx="140" cy="170" r="4" fill="#34d399"/>
  <circle cx="195" cy="170" r="4" fill="#34d399"/>
  <circle cx="248" cy="170" r="4" fill="#ffd166"/>
  <circle cx="300" cy="170" r="4" fill="#ff6b6b"/>
  <!-- Dashboard card -->
  <rect x="420" y="80" width="320" height="200" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="445" y="115" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="13" font-weight="600">Stock Overview</text>
  <!-- Bar chart -->
  <rect x="445" y="145" width="30" height="80" rx="4" fill="#2f81f7" opacity="0.6"/>
  <rect x="485" y="165" width="30" height="60" rx="4" fill="#34d399" opacity="0.6"/>
  <rect x="525" y="135" width="30" height="90" rx="4" fill="#ffd166" opacity="0.6"/>
  <rect x="565" y="175" width="30" height="50" rx="4" fill="#a78bfa" opacity="0.6"/>
  <rect x="605" y="155" width="30" height="70" rx="4" fill="#ff6b6b" opacity="0.6"/>
  <rect x="645" y="185" width="30" height="40" rx="4" fill="#2f81f7" opacity="0.4"/>
  <!-- Shopping list card -->
  <rect x="420" y="300" width="150" height="140" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="440" y="330" fill="#34d399" font-family="system-ui" font-size="11" font-weight="600" letter-spacing="0.1em">SHOPPING LIST</text>
  <rect x="440" y="345" width="110" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="440" y="345" width="75" height="8" rx="4" fill="#2f81f7" opacity="0.5"/>
  <rect x="440" y="365" width="110" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="440" y="365" width="90" height="8" rx="4" fill="#ffd166" opacity="0.5"/>
  <rect x="440" y="385" width="110" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="440" y="385" width="45" height="8" rx="4" fill="#ff6b6b" opacity="0.5"/>
  <rect x="440" y="405" width="110" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="440" y="405" width="100" height="8" rx="4" fill="#34d399" opacity="0.5"/>
  <!-- Alert card -->
  <rect x="590" y="300" width="150" height="140" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="610" y="330" fill="#ff6b6b" font-family="system-ui" font-size="11" font-weight="600" letter-spacing="0.1em">ALERTS</text>
  <circle cx="615" cy="358" r="6" fill="#ff6b6b" opacity="0.3"/>
  <text x="628" y="362" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">Telur habis</text>
  <circle cx="615" cy="388" r="6" fill="#ffd166" opacity="0.3"/>
  <text x="628" y="392" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">Beras menipis</text>
  <circle cx="615" cy="418" r="6" fill="#ff6b6b" opacity="0.3"/>
  <text x="628" y="422" fill="rgba(255,255,255,0.6)" font-family="system-ui" font-size="10">Susu kadaluarsa</text>
</svg>