<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <circle cx="400" cy="280" r="120" fill="#ffd166" opacity="0.06" filter="url(#blur2)"/>
  <circle cx="650" cy="120" r="150" fill="#a78bfa" opacity="0.05" filter="url(#blur2)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.15">
    <circle cx="80" cy="60" r="1.5"/><circle cx="180" cy="40" r="1"/><circle cx="300" cy="80" r="1.2"/>
    <circle cx="520" cy="50" r="1"/><circle cx="680" cy="90" r="1.5"/><circle cx="750" cy="45" r="1"/>
    <circle cx="150" cy="150" r="1"/><circle cx="400" cy="30" r="1.3"/><circle cx="600" cy="170" r="1"/>
  </g>
  <!-- Phone mockup -->
  <rect x="280" y="60" width="240" height="380" rx="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <rect x="290" y="80" width="220" height="340" rx="20" fill="rgba(0,0,0,0.3)"/>
  <!-- Notch -->
  <rect x="355" y="64" width="90" height="12" rx="6" fill="rgba(0,0,0,0.5)"/>
  <!-- Quote content inside phone -->
  <text x="400" y="145" text-anchor="middle" fill="#ffd166" font-family="Georgia, serif" font-size="36" opacity="0.6">"</text>
  <text x="400" y="195" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Georgia, serif" font-size="14" font-style="italic">The only way to do</text>
  <text x="400" y="215" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Georgia, serif" font-size="14" font-style="italic">great work is to love</text>
  <text x="400" y="235" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Georgia, serif" font-size="14" font-style="italic">what you do.</text>
  <text x="400" y="275" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="600">— Steve Jobs</text>
  <!-- Category pill -->
  <rect x="340" y="300" width="120" height="28" rx="14" fill="rgba(167,139,250,0.2)" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="400" y="319" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="10" font-weight="600" letter-spacing="0.08em">WISDOM</text>
  <!-- Action buttons -->
  <circle cx="330" cy="370" r="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="330" y="375" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14">♡</text>
  <circle cx="400" cy="370" r="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="400" y="375" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="12">📋</text>
  <circle cx="470" cy="370" r="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="470" y="375" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="12">🌐</text>
  <!-- Floating quote cards around phone -->
  <rect x="560" y="100" width="180" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" transform="rotate(3 650 150)"/>
  <text x="580" y="130" fill="rgba(255,255,255,0.5)" font-family="Georgia, serif" font-size="11" font-style="italic">"Be the change you</text>
  <text x="580" y="148" fill="rgba(255,255,255,0.5)" font-family="Georgia, serif" font-size="11" font-style="italic">wish to see in the</text>
  <text x="580" y="166" fill="rgba(255,255,255,0.5)" font-family="Georgia, serif" font-size="11" font-style="italic">world."</text>
  <text x="580" y="188" fill="#ffd166" font-family="system-ui" font-size="9" font-weight="600" opacity="0.7">— Gandhi</text>
  <rect x="60" y="200" width="170" height="90" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1" transform="rotate(-2 145 245)"/>
  <text x="80" y="228" fill="rgba(255,255,255,0.45)" font-family="Georgia, serif" font-size="11" font-style="italic">"Innovation is</text>
  <text x="80" y="246" fill="rgba(255,255,255,0.45)" font-family="Georgia, serif" font-size="11" font-style="italic">distinguishing between</text>
  <text x="80" y="264" fill="rgba(255,255,255,0.45)" font-family="Georgia, serif" font-size="11" font-style="italic">a bug and a feature."</text>
  <text x="80" y="282" fill="#34d399" font-family="system-ui" font-size="9" font-weight="600" opacity="0.7">— Kevin Kelly</text>
</svg>